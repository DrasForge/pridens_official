<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voucher Editor - Marketing Centre</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <style>
        :root { --glass-bg: rgba(255, 255, 255, 0.03); }
        .editor-card { background: var(--glass-bg); border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 28px; margin-bottom: 24px; }
        .section-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
        .section-header ion-icon { font-size: 1.4rem; color: #22c55e; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 0.75rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; }
        .form-group input, .form-group select { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 14px; color: #fff; font-family: inherit; }
        .form-group select option { background: #0f172a; color: #fff; }
        
        .radio-group { display: flex; gap: 16px; margin-top: 8px; }
        .radio-item { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.9rem; }
        .radio-item input { width: 18px; height: 18px; margin: 0; }

        .product-selector { background: rgba(0,0,0,0.2); border-radius: 16px; border: 1px dashed rgba(255,255,255,0.1); padding: 32px; text-align: center; cursor: pointer; transition: 0.2s; }
        .product-selector:hover { border-color: #22c55e; background: rgba(34,197,94,0.05); }

        .items-table { width: 100%; border-collapse: collapse; margin-top: 24px; }
        .items-table th { text-align: left; padding: 12px; font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; border-bottom: 2px solid rgba(255,255,255,0.05); }
        .items-table td { padding: 16px 12px; border-bottom: 1px solid rgba(255,255,255,0.03); }

        .modal { display:none; position:fixed; z-index:1000; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.8); backdrop-filter: blur(8px); }
        .modal-content { background:#0f172a; border: 1px solid rgba(255,255,255,0.1); border-radius:24px; width:90%; max-width:800px; margin: 5vh auto; height:90vh; display:flex; flex-direction:column; }
        .modal-header { padding:24px; border-bottom:1px solid rgba(255,255,255,0.05); display:flex; justify-content:space-between; align-items:center; }
        .modal-body { flex:1; overflow-y:auto; padding:24px; }
        .modal-footer { padding:24px; border-top:1px solid rgba(255,255,255,0.05); text-align:right; }

        .picker-item { display:flex; gap:16px; padding:16px; border-bottom:1px solid rgba(255,255,255,0.03); align-items:center; cursor:pointer; }
        .picker-item:hover { background:rgba(255,255,255,0.03); }

        .sticky-footer { position: sticky; bottom: 0; background: #0f172a; padding: 20px 32px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; gap: 16px; align-items: center; justify-content: flex-end; z-index: 100; }
        .btn-primary { background: #22c55e; color: #fff; padding: 14px 40px; border-radius: 12px; font-weight: 700; border: none; cursor: pointer; }
    </style>
</head>
<body class="dashboard-body">
    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-content">
            <header class="top-header">
                <button class="menu-btn" id="open-sidebar"><ion-icon name="menu-outline"></ion-icon></button>
            </header>

            <div class="dashboard-content" style="padding-bottom: 100px;">
                <div style="margin-bottom:32px;">
                    <a href="#" id="back-link" style="color:var(--text-dim); text-decoration:none; font-size:0.9rem; display:flex; align-items:center; gap:6px; margin-bottom:8px;"><ion-icon name="arrow-back-outline"></ion-icon> Back to Marketing</a>
                    <h1 id="page-title">Voucher Editor</h1>
                    <p style="color:var(--text-dim); font-size:0.9rem; margin-top:8px;">Design shop-wide or product-specific vouchers to boost conversion.</p>
                </div>

                <form id="voucher-form">
                    <input type="hidden" id="v-id" name="id">
                    <input type="hidden" id="v-merchant-id" name="merchant_id">

                    <div class="editor-card">
                        <div class="section-header"><ion-icon name="settings-outline"></ion-icon><h2>Basic Information</h2></div>
                        <div class="form-grid">
                            <div class="form-group"><label>Voucher Name</label><input type="text" name="name" id="v-name" placeholder="e.g. New Customer Welcome" required></div>
                            <div class="form-group"><label>Voucher Code</label><input type="text" name="voucher_code" id="v-code" placeholder="e.g. WELCOME10" required></div>
                            <div class="form-group">
                                <label>Target Buyer (Trigger)</label>
                                <select name="type" id="v-type">
                                    <option value="Standard">Standard (All Users)</option>
                                    <option value="New User">New User (0 Orders)</option>
                                    <option value="Follower">Follower Only</option>
                                    <option value="Frequent Buyer">Frequent Buyer</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="editor-card">
                        <div class="section-header"><ion-icon name="flash-outline"></ion-icon><h2>Reward Settings</h2></div>
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Reward Type</label>
                                <div class="radio-group">
                                    <label class="radio-item"><input type="radio" name="reward_type" value="Percentage" checked> Percentage</label>
                                    <label class="radio-item"><input type="radio" name="reward_type" value="Fixed"> Fixed Amount (₱)</label>
                                </div>
                            </div>
                            <div class="form-group"><label>Reward Value</label><input type="number" step="0.01" name="reward_value" id="v-value" placeholder="e.g. 5 or 100" required></div>
                            <div class="form-group"><label>Min. Spend to Apply (₱)</label><input type="number" step="0.01" name="min_spend" id="v-min-spend" value="0.00"></div>
                        </div>
                        <div class="form-grid" style="margin-top: 24px;">
                            <div class="form-group">
                                <label>Usage Limit per User</label>
                                <input type="number" name="usage_limit_per_user" id="v-limit-user" value="1" required>
                                <p style="font-size:0.7rem; color:var(--text-dim);">How many times ONE customer can use this voucher.</p>
                            </div>
                            <div class="form-group"><label>Start Date & Time</label><input type="datetime-local" name="start_time" id="v-start" required></div>
                            <div class="form-group"><label>End Date & Time</label><input type="datetime-local" name="end_time" id="v-end" required></div>
                        </div>
                    </div>

                        <div class="form-group" style="margin-bottom:24px;">
                            <label>Apply voucher to:</label>
                            <select name="item_category" id="v-category" onchange="loadEligibleItems()">
                                <option value="Products">Products</option>
                                <option value="Foods">Food & Beverages</option>
                                <option value="Services">Professional Services</option>
                                <option value="Spots">Spots / Venue Rentals</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Applicability</label>
                            <div class="radio-group" style="margin-bottom:20px;">
                                <label class="radio-item"><input type="radio" name="target_type" value="All" checked onclick="toggleProductSelector(false)"> Shop-wide (All items in category)</label>
                                <label class="radio-item"><input type="radio" name="target_type" value="Selected" onclick="toggleProductSelector(true)"> Selected items only</label>
                            </div>
                        </div>

                        <div id="product-selector-area" style="display:none;">
                            <div class="product-selector" onclick="openPicker()">
                                <ion-icon name="add-circle-outline" style="font-size:2rem; color:#22c55e;"></ion-icon>
                                <div style="font-weight:700; margin-top:12px;">Select Products for this Voucher</div>
                            </div>
                            <table id="selected-items-table" class="items-table" style="display:none;">
                                <thead><tr><th>Product Name</th><th>Price</th><th></th></tr></thead>
                                <tbody id="selected-list"></tbody>
                            </table>
                        </div>
                    </div>

                    <div class="sticky-footer">
                        <button type="button" onclick="window.history.back()" style="background:transparent; color:#fff; border:none; cursor:pointer;">Discard</button>
                        <button type="submit" id="save-btn" class="btn-primary">Confirm and Save Voucher</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- Product Picker Modal -->
    <div id="picker-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Select Products</h2>
                <ion-icon name="close" onclick="closePicker()" style="font-size:1.8rem; cursor:pointer;"></ion-icon>
            </div>
            <div id="picker-body" class="modal-body"></div>
            <div class="modal-footer">
                <button class="btn-primary" onclick="closePicker()">Done Selecting</button>
            </div>
        </div>
    </div>

    <script src="js/marketplace-sidebar.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const merchantId = urlParams.get('merchant_id') || urlParams.get('id');
        const voucherId = urlParams.get('id') && urlParams.has('merchant_id') ? urlParams.get('id') : null;

        let allProducts = [];
        let selectedProductIds = [];

        document.addEventListener('DOMContentLoaded', () => {
            if (!merchantId) { window.location.href = 'merchants.html'; return; }
            document.getElementById('v-merchant-id').value = merchantId;
            document.getElementById('back-link').href = `merchant_marketing.html?id=${merchantId}`;
            
            loadEligibleItems();
            if (voucherId) loadVoucherDetails();
        });

        async function loadEligibleItems() {
            try {
                const category = document.getElementById('v-category').value;
                const pickerBtn = document.querySelector('.product-selector');
                pickerBtn.style.opacity = '0.5';
                pickerBtn.style.pointerEvents = 'none';

                selectedProductIds = [];
                renderSelectedTable();
                
                const res = await fetch(`../admin_API/get_merchant_eligible_items.php?merchant_id=${merchantId}&type=${category}`);
                const json = await res.json();

                pickerBtn.style.opacity = '1';
                pickerBtn.style.pointerEvents = 'auto';

                if (json.status === 'success') {
                    allProducts = json.data;
                } else {
                    alert('API Error: ' + json.message);
                }
            } catch (e) {
                alert('Connection Error: ' + e.message);
            }
        }

        async function loadVoucherDetails() {
            // Placeholder: Implement load if editing existing
            document.getElementById('page-title').innerText = 'Edit Voucher';
        }

        function toggleProductSelector(show) {
            document.getElementById('product-selector-area').style.display = show ? 'block' : 'none';
        }

        function openPicker() {
            const category = document.getElementById('v-category').value;
            const body = document.getElementById('picker-body');
            const modalTitle = document.querySelector('#picker-modal h2');
            modalTitle.innerText = `Select ${category.replace('s','')}`;

            body.innerHTML = '';
            if (allProducts.length === 0) {
                body.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-dim);">No active ${category.toLowerCase()} found for this merchant.</div>`;
            }

            allProducts.forEach(p => {
                const isSelected = selectedProductIds.includes(parseInt(p.id));
                const div = document.createElement('div');
                div.className = 'picker-item';
                div.innerHTML = `
                    <div style="flex:1;">
                        <div style="font-weight:600;">${p.name}</div>
                        <div style="font-size:0.8rem; color:var(--text-dim);">${p.pridens_sku || 'Item ID: '+p.id}</div>
                    </div>
                    <div style="font-weight:700;">₱${p.price}</div>
                    <button type="button" onclick="toggleItem(${p.id}, event)" class="status-badge ${isSelected ? 'status-added' : 'status-add'}" style="background:rgba(34,197,94,0.15); color:#4ade80; border:none; padding:4px 12px; border-radius:20px; cursor:pointer;">${isSelected ? 'Added' : 'Add'}</button>
                `;
                body.appendChild(div);
            });
            document.getElementById('picker-modal').style.display = 'block';
        }

        function toggleItem(id, event) {
            event.stopPropagation();
            const idx = selectedProductIds.indexOf(parseInt(id));
            if (idx > -1) { selectedProductIds.splice(idx, 1); } 
            else { selectedProductIds.push(parseInt(id)); }
            openPicker();
            renderSelectedTable();
        }

        function closePicker() { document.getElementById('picker-modal').style.display = 'none'; }

        function renderSelectedTable() {
            const table = document.getElementById('selected-items-table');
            const list = document.getElementById('selected-list');
            if (selectedProductIds.length === 0) { table.style.display = 'none'; return; }
            table.style.display = 'table';
            list.innerHTML = '';
            selectedProductIds.forEach(id => {
                const p = allProducts.find(x => x.id == id);
                if (!p) return;
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${p.name}</td><td>₱${p.price}</td><td><ion-icon name="trash-outline" onclick="toggleItem(${id}, event)" style="cursor:pointer; color:#f87171;"></ion-icon></td>`;
                list.appendChild(tr);
            });
        }

        document.getElementById('voucher-form').onsubmit = async (e) => {
            e.preventDefault();
            const targetType = document.querySelector('input[name="target_type"]:checked').value;
            if (targetType === 'Selected' && selectedProductIds.length === 0) { alert('Please select at least one product.'); return; }

            const btn = document.getElementById('save-btn');
            btn.disabled = true; btn.innerText = "Saving...";

            const fd = new FormData(e.target);
            fd.append('item_ids_json', JSON.stringify(selectedProductIds));

            try {
                const res = await fetch('../admin_API/save_merchant_voucher.php', { method: 'POST', body: fd });
                const json = await res.json();
                if (json.status === 'success') { window.location.href = `merchant_marketing.html?id=${merchantId}`; } 
                else { alert(json.message); btn.disabled = false; btn.innerText = "Confirm and Save Voucher"; }
            } catch (e) { btn.disabled = false; btn.innerText = "Confirm and Save Voucher"; }
        };
    </script>
</body>
</html>
