<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Teams - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <style>
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
        
        .team-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px;
            padding: 24px; display: flex; flex-direction: column; gap: 16px;
            backdrop-filter: blur(10px); transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .team-card:hover { transform: translateY(-5px); border-color: var(--primary-color); }
        
        .team-header { display: flex; align-items: center; gap: 16px; }
        .team-logo {
            width: 64px; height: 64px; border-radius: 50%; object-fit: cover;
            border: 3px solid var(--primary-color); background: #1e293b;
        }
        .team-info h3 { margin: 0; font-size: 1.1rem; color: #fff; }
        .team-parent { font-size: 0.75rem; color: var(--accent-blue); display: block; margin-top: 2px; }
        
        .team-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 8px 0; }
        .stat-box { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; text-align: center; }
        .stat-box label { display: block; font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 4px; }
        .stat-box span { font-size: 1rem; font-weight: 600; color: #fff; }

        .leader-badge {
            display: flex; align-items: center; gap: 8px; padding: 10px;
            background: rgba(99,102,241,0.1); border-radius: 12px; border: 1px solid rgba(99,102,241,0.2);
        }
        .leader-badge ion-icon { color: var(--accent-blue); font-size: 1.2rem; }
        .leader-details { line-height: 1.2; }
        .leader-name { font-size: 0.85rem; font-weight: 600; color: #fff; display: block; }
        .leader-rank { font-size: 0.7rem; color: var(--text-dim); }

        .card-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 10px; }
        .btn-card { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px; border-radius: 10px; font-size: 0.8rem; cursor: pointer; transition: 0.3s; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.02); color: #fff; }
        .btn-card:hover { background: rgba(255,255,255,0.1); }
        .btn-card-primary { background: var(--primary-color); border: none; }
        .btn-card-primary:hover { background: var(--primary-hover); }

        /* Modal Styles */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal.open { display: flex; }
        .modal-content { background: #0f172a; width: 100%; max-width: 500px; border-radius: 24px; border: 1px solid var(--border-color); overflow: hidden; position: relative; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-header { padding: 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 24px; max-height: 70vh; overflow-y: auto; }
        .modal-footer { padding: 20px 24px; border-top: 1px solid var(--border-color); display: flex; gap: 12px; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--text-dim); margin-bottom: 8px; }
        .form-input { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); border-radius: 12px; color: #fff; font-family: inherit; font-size: 0.9rem; }
        .form-input:focus { outline: none; border-color: var(--primary-color); }

        .logo-upload-wrap { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
        .logo-preview { width: 80px; height: 80px; border-radius: 50%; border: 2px dashed var(--border-color); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .logo-preview img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body class="dashboard-body">
    <div class="background-animation">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="dashboard-layout">
        <!-- Main Sidebar -->
        <aside class="sidebar" id="sidebar"></aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <button class="menu-btn" id="open-sidebar"><ion-icon name="menu-outline"></ion-icon></button>
                <div class="welcome-banner" style="margin-bottom: 0;">
                    <h1 style="font-size: 20px;">Agent Teams</h1>
                </div>
                <div class="header-profile">
                    <div class="avatar"><img src="https://ui-avatars.com/api/?name=Admin&background=6366f1&color=fff" alt="Admin"></div>
                </div>
            </header>

            <div class="dashboard-content">
                <div class="page-header">
                    <div>
                        <h1 style="font-size: 24px; margin-bottom: 4px;">Network Organization</h1>
                        <p style="color: var(--text-dim); font-size: 0.9rem;">Manage team structures, leaders, and hierarchy.</p>
                    </div>
                    <button class="btn-primary" onclick="openCreateModal()" style="padding: 12px 24px;">
                        <ion-icon name="add-outline" style="margin-right: 8px;"></ion-icon> Create New Team
                    </button>
                </div>

                <div id="pending-setups" class="pending-section" style="display: none; margin-bottom: 32px;">
                    <div style="background: rgba(99,102,241,0.05); border: 1px solid var(--border-color); border-radius: 20px; padding: 24px;">
                        <h3 style="font-size: 1rem; color: #fff; margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
                            <ion-icon name="alert-circle" style="color: var(--accent-blue);"></ion-icon>
                            Pending Team Initializations
                        </h3>
                        <div id="pending-list" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;">
                            <!-- Pending agents will appear here -->
                        </div>
                    </div>
                </div>

                <div id="team-list" class="team-grid">
                    <!-- Teams will be loaded here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Create/Edit Team Modal -->
    <div class="modal" id="team-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Create Team</h3>
                <button class="panel-close-btn" onclick="closeModal()"><ion-icon name="close-outline"></ion-icon></button>
            </div>
            <form id="team-form">
                <div class="modal-body">
                    <input type="hidden" id="edit-id" name="id">
                    <input type="hidden" id="existing-logo" name="existing_logo">
                    
                    <div class="logo-upload-wrap">
                        <div class="logo-preview" id="logo-preview">
                            <ion-icon name="image-outline" style="font-size: 2rem; color: var(--text-dim);"></ion-icon>
                        </div>
                        <div>
                            <label class="btn-card" style="cursor: pointer;">
                                <ion-icon name="cloud-upload-outline"></ion-icon> Upload Logo
                                <input type="file" id="team-logo-input" name="team_logo" accept="image/*" style="display: none;" onchange="previewLogo(this)">
                            </label>
                            <p style="font-size: 0.7rem; color: var(--text-dim); margin-top: 6px;">Recommended: Square PNG/JPG</p>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Team Name</label>
                        <input type="text" name="team_name" id="team-name" class="form-input" placeholder="e.g., Team Vanguard" required>
                    </div>

                    <div class="form-group">
                        <label>Team Leader</label>
                        <select name="leader_id" id="leader-select" class="form-input" required>
                            <option value="">Select an eligible leader...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Parent Team (Optional)</label>
                        <select name="parent_team_id" id="parent-select" class="form-input">
                            <option value="">Root Team (No Parent)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Team Goal / Description</label>
                        <textarea name="team_goal" id="team-goal" class="form-input" style="min-height: 80px;" placeholder="What is this team's primary objective?"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-card" onclick="closeModal()" style="flex: 1;">Cancel</button>
                    <button type="submit" class="btn-primary" style="flex: 2; padding: 12px;">Save Team</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/sidebar-module.js"></script>
    <script src="js/agent_teams.js"></script>
</body>
</html>
