<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Category Manager - Marketplace</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <style>
        .cat-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 24px; transition: all 0.3s; position: relative; overflow: hidden; display: flex; align-items: center; gap: 20px; }
        .cat-card:hover { border-color: rgba(99, 102, 241, 0.3); transform: translateY(-4px); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .cat-img { width: 80px; height: 80px; border-radius: 12px; object-fit: cover; background: rgba(255,255,255,0.05); }
        .cat-info { flex: 1; }
        .cat-name { font-weight: 700; font-size: 1.1rem; color: #fff; margin-bottom: 4px; }
        .cat-desc { font-size: 0.85rem; color: var(--text-dim); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .cat-actions { display: flex; gap: 8px; }
        .btn-cat-action { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; transition: 0.2s; font-size: 1.1rem; }
        .btn-cat-edit { background: rgba(99, 102, 241, 0.1); color: #818cf8; }
        .btn-cat-edit:hover { background: #6366f1; color: #fff; }
        .btn-cat-delete { background: rgba(239, 68, 68, 0.1); color: #f87171; }
        .btn-cat-delete:hover { background: #ef4444; color: #fff; }

        .form-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 10000; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .form-content { background: #0f172a; border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 32px; width: 90%; max-width: 500px; }
    </style>
</head>
<body class="dashboard-body">
    <div class="background-animation">
        <div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div>
    </div>

    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-content">
            <header class="top-header">
                <button class="menu-btn" id="open-sidebar"><ion-icon name="menu-outline"></ion-icon></button>
                <div class="header-profile">
                    <div class="avatar"><img src="https://ui-avatars.com/api/?name=Admin&background=6366f1&color=fff" alt="Admin"></div>
                </div>
            </header>

            <div class="dashboard-content">
                <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:32px;">
                    <div>
                        <h1 id="merchant-name">Shop Categories</h1>
                        <p style="color:var(--text-dim);">Organize your marketplace items into custom collections.</p>
                    </div>
                    <button class="btn-primary" onclick="openAddModal()" style="display:inline-flex; align-items:center; gap:8px; padding:12px 24px; border-radius:12px; font-weight:700;">
                        <ion-icon name="add-circle-outline" style="font-size:1.2rem;"></ion-icon> Create Category
                    </button>
                </div>

                <div id="categories-grid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap:20px;">
                    <!-- Categories will load here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Category Form Modal -->
    <div id="catModal" class="form-modal">
        <div class="form-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
                <h2 id="modal-title" style="margin:0;">Create Shop Category</h2>
                <button onclick="closeModal()" style="background:none; border:none; color:var(--text-dim); font-size:1.8rem; cursor:pointer;">&times;</button>
            </div>
            <form id="catForm">
                <input type="hidden" id="f-id" name="id">
                <input type="hidden" id="f-merchant-id" name="merchant_id">

                <div style="display:flex; flex-direction:column; gap:20px;">
                    <div class="form-group">
                        <label style="font-size:0.75rem; color:var(--text-dim); font-weight:700;">CATEGORY NAME</label>
                        <input type="text" name="name" id="f-name" required placeholder="e.g. Summer Collection 2024" style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:12px; color:#fff;">
                    </div>
                    
                    <div class="form-group">
                        <label style="font-size:0.75rem; color:var(--text-dim); font-weight:700;">DESCRIPTION (OPTIONAL)</label>
                        <textarea name="description" id="f-desc" rows="3" style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:12px; color:#fff; font-family:inherit;"></textarea>
                    </div>

                    <div class="form-group">
                        <label style="font-size:0.75rem; color:var(--text-dim); font-weight:700;">CATEGORY COVER IMAGE</label>
                        <div style="display:flex; align-items:center; gap:16px; margin-top:8px;">
                            <div id="img-prev" style="width:60px; height:60px; border-radius:10px; background:rgba(255,255,255,0.05); border:1px dashed rgba(255,255,255,0.2); overflow:hidden;"></div>
                            <input type="file" name="image" id="f-image" accept="image/*" onchange="previewImage(this)">
                        </div>
                        <input type="hidden" name="existing_image" id="f-existing-image">
                    </div>

                    <div style="display:flex; gap:12px; margin-top:12px;">
                        <button type="submit" class="btn-primary" style="flex:1; padding:14px; font-weight:700;">Save Category</button>
                        <button type="button" onclick="closeModal()" style="flex:1; background:transparent; border:1px solid rgba(255,255,255,0.1); color:#fff; border-radius:12px; cursor:pointer;">Cancel</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="js/marketplace-sidebar.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const merchantId = urlParams.get('id') || urlParams.get('merchant_id');

        if (!merchantId) { window.location.href='merchants.html'; }

        document.addEventListener('DOMContentLoaded', () => {
            loadCategories();
        });

        async function loadCategories() {
            const grid = document.getElementById('categories-grid');
            try {
                const res = await fetch(`../admin_API/get_merchant_categories.php?merchant_id=${merchantId}`);
                const json = await res.json();

                if (json.status === 'success') {
                    if (json.data.length === 0) {
                        grid.style.display = 'block';
                        grid.innerHTML = `
                            <div style="padding:100px; text-align:center; border:2px dashed rgba(255,255,255,0.05); border-radius:24px;">
                                <ion-icon name="albums-outline" style="font-size:64px; color:rgba(255,255,255,0.1); margin-bottom:20px;"></ion-icon>
                                <h3 style="color:var(--text-dim);">No Custom Categories</h3>
                                <p style="color:rgba(255,255,255,0.3); margin-top:8px;">Merchants can create their own categories to organize products.</p>
                            </div>
                        `;
                        return;
                    }

                    grid.style.display = 'grid';
                    grid.innerHTML = json.data.map(cat => {
                        const img = cat.image_path ? `../admin_API/${cat.image_path}` : 'https://ui-avatars.com/api/?name=Cat&background=random';
                        return `
                            <div class="cat-card fade-in">
                                <img src="${img}" class="cat-img">
                                <div class="cat-info">
                                    <div class="cat-name">${cat.name}</div>
                                    <div class="cat-desc">${cat.description || 'No description provided.'}</div>
                                </div>
                                <div class="cat-actions">
                                    <button class="btn-cat-action btn-cat-edit" onclick='editCategory(${JSON.stringify(cat).replace(/'/g, "&apos;")})'><ion-icon name="create-outline"></ion-icon></button>
                                    <button class="btn-cat-action btn-cat-delete" onclick="deleteCategory(${cat.id})"><ion-icon name="trash-outline"></ion-icon></button>
                                </div>
                            </div>
                        `;
                    }).join('');
                }
            } catch(e) { console.error(e); }
        }

        function openAddModal() {
            document.getElementById('modal-title').textContent = 'Create Shop Category';
            document.getElementById('catForm').reset();
            document.getElementById('f-id').value = '';
            document.getElementById('f-merchant-id').value = merchantId;
            document.getElementById('img-prev').innerHTML = '';
            document.getElementById('catModal').style.display = 'flex';
        }

        function editCategory(cat) {
            document.getElementById('modal-title').textContent = 'Edit Shop Category';
            document.getElementById('f-id').value = cat.id;
            document.getElementById('f-merchant-id').value = cat.merchant_id;
            document.getElementById('f-name').value = cat.name;
            document.getElementById('f-desc').value = cat.description;
            document.getElementById('f-existing-image').value = cat.image_path;
            if (cat.image_path) {
                document.getElementById('img-prev').innerHTML = `<img src="../admin_API/${cat.image_path}" style="width:100%; height:100%; object-fit:cover;">`;
            } else {
                document.getElementById('img-prev').innerHTML = '';
            }
            document.getElementById('catModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('catModal').style.display = 'none'; }

        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('img-prev').innerHTML = `<img src="${e.target.result}" style="width:100%; height:100%; object-fit:cover;">`;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        document.getElementById('catForm').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            try {
                const res = await fetch('../admin_API/save_merchant_category.php', {
                    method: 'POST',
                    body: formData
                });
                const json = await res.json();
                if (json.status === 'success') {
                    closeModal();
                    loadCategories();
                } else { alert(json.message); }
            } catch(err) { alert('Network Error'); }
        };

        async function deleteCategory(id) {
            if (!confirm('Are you sure you want to delete this category? Products in this category will be unassigned.')) return;
            try {
                const res = await fetch('../admin_API/delete_merchant_category.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({id})
                });
                const json = await res.json();
                if (json.status === 'success') { loadCategories(); }
            } catch(e) {}
        }
    </script>
</body>
</html>
