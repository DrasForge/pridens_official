<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merchant Marketplace - Order Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <style>
        .tabs-container { display: flex; gap: 32px; border-bottom: 1px solid rgba(255,255,255,0.06); margin-bottom: 30px; padding: 0 10px; overflow-x: auto; scrollbar-width: none; }
        .tabs-container::-webkit-scrollbar { display: none; }
        .tab-item { padding: 15px 0; color: var(--text-dim); cursor: pointer; font-size: 0.95rem; font-weight: 600; position: relative; transition: all 0.2s; white-space: nowrap; }
        .tab-item:hover { color: #fff; }
        .tab-item.active { color: #6366f1; }
        .tab-item.active::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 3px; background: #6366f1; border-radius: 3px; }

        .order-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; margin-bottom: 20px; overflow: hidden; transition: all 0.2s; }
        .order-card:hover { border-color: rgba(99, 102, 241, 0.3); background: rgba(255,255,255,0.04); }
        
        .order-header { padding: 15px 20px; background: rgba(255,255,255,0.02); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .order-body { padding: 20px; }
        .order-footer { padding: 15px 20px; background: rgba(255,255,255,0.01); display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.03); }

        .buyer-info { display: flex; align-items: center; gap: 10px; }
        .buyer-avatar { width: 24px; height: 24px; border-radius: 50%; background: #6366f1; color: #fff; font-size: 0.7rem; display: flex; align-items: center; justify-content: center; font-weight: 700; }

        .order-item { display: flex; gap: 15px; margin-bottom: 15px; }
        .order-item:last-child { margin-bottom: 0; }
        .item-img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; background: rgba(255,255,255,0.05); }

        .btn-status { padding: 8px 16px; border-radius: 8px; font-weight: 700; border: none; cursor: pointer; transition: all 0.2s; font-size: 0.85rem; }
        .btn-primary { background: #6366f1; color: #fff; }
        .btn-primary:hover { background: #4f46e5; transform: translateY(-2px); }
        
        .status-badge { padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }
        .st-paymentsent { background: rgba(168, 85, 247, 0.1); color: #a855f7; }
        .st-toship { background: rgba(234, 179, 8, 0.1); color: #facc15; }
        .st-shipping { background: rgba(99, 102, 241, 0.1); color: #818cf8; }
        .st-completed { background: rgba(34, 197, 94, 0.1); color: #4ade80; }
        .st-cancelled { background: rgba(239, 68, 68, 0.1); color: #f87171; }
        .st-unpaid { background: rgba(148, 163, 184, 0.1); color: #94a3b8; }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="dashboard-body">
    <div class="background-animation">
        <div class="orb orb-1"></div>
    </div>

    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-content">
            <header class="top-header">
                <div>
                    <h1>Order Management</h1>
                    <p style="color:var(--text-dim); font-size:0.85rem;">Track sales and fulfill customer orders</p>
                </div>
                <div class="header-search" style="flex:1; max-width:400px; margin-left:40px;">
                    <ion-icon name="search-outline"></ion-icon>
                    <input type="text" id="order-search" placeholder="Search Order SN, Buyer Name..." oninput="filterOrders()">
                </div>
            </header>

            <div class="dashboard-content">
                <div class="tabs-container">
                    <div class="tab-item active" onclick="switchTab('All', this)">All</div>
                    <div class="tab-item" onclick="switchTab('Unpaid', this)">Unpaid</div>
                    <div class="tab-item" onclick="switchTab('Payment Sent', this)">Verifying</div>
                    <div class="tab-item" onclick="switchTab('To Ship', this)">To Ship</div>
                    <div class="tab-item" onclick="switchTab('Shipping', this)">Shipping</div>
                    <div class="tab-item" onclick="switchTab('Completed', this)">Completed</div>
                    <div class="tab-item" onclick="switchTab('Cancelled', this)">Cancelled</div>
                </div>

                <div id="orders-list-container">
                    <div style="text-align:center; padding:100px;">
                        <ion-icon name="hourglass-outline" style="font-size:32px; animation:spin 1s linear infinite; color:#6366f1;"></ion-icon>
                        <p style="margin-top:16px; color:var(--text-dim);">Fetching your orders...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Proof Viewer Modal -->
    <div id="proof-modal" class="modal-overlay" style="display:none; z-index:2000;">
        <div class="modal-content" style="max-width:500px; background:rgba(20,20,30,0.95);">
            <div class="modal-header">
                <h2>Payment Proof</h2>
                <button class="close-modal" onclick="closeProofModal()">&times;</button>
            </div>
            <div id="proof-image-container" style="margin-top:20px; text-align:center;">
                <img src="" id="proof-image" style="max-width:100%; border-radius:12px; border:1px solid rgba(255,255,255,0.1);">
            </div>
            <div style="margin-top:20px; padding:15px; background:rgba(255,255,255,0.03); border-radius:10px;">
                <p style="font-size:0.75rem; color:var(--text-dim); text-transform:uppercase; font-weight:700;">Channel Used:</p>
                <p id="proof-channel-info" style="color:#fff; font-weight:600; margin-top:4px;">Direct Bank/E-Wallet</p>
            </div>
        </div>
    </div>

    <script src="js/marketplace-sidebar.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const merchantId = urlParams.get('id') || urlParams.get('merchant_id');
        let currentTab = 'All';
        let allOrders = [];

        if (!merchantId) {
            alert('Invalid Merchant ID');
            window.location.href = 'merchants.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadOrders();
        });

        async function loadOrders() {
            const container = document.getElementById('orders-list-container');
            const url = `../admin_API/get_merchant_orders.php?merchant_id=${merchantId}${currentTab !== 'All' ? `&status=${currentTab}` : ''}`;
            
            try {
                const res = await fetch(url);
                const json = await res.json();

                if (json.status !== 'success') {
                    container.innerHTML = `<div style="padding:40px; text-align:center; color:#f87171;">${json.message}</div>`;
                    return;
                }

                allOrders = json.data;
                renderOrders(allOrders);

            } catch (e) {
                container.innerHTML = `<div style="padding:40px; text-align:center; color:#f87171;">Connection Error</div>`;
            }
        }

        function renderOrders(orders) {
            const container = document.getElementById('orders-list-container');
            if (orders.length === 0) {
                container.innerHTML = `
                    <div style="padding:100px 40px; text-align:center;">
                        <ion-icon name="receipt-outline" style="font-size:64px; color:rgba(255,255,255,0.1); margin-bottom:20px;"></ion-icon>
                        <h3 style="color:var(--text-dim);">No Orders Found</h3>
                        <p style="color:rgba(255,255,255,0.4); margin-top:8px;">No orders found in the "${currentTab}" category.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = orders.map(order => {
                const statusClass = order.status.replace(/\s+/g, '').toLowerCase();
                const totalQty = order.items.reduce((sum, item) => sum + parseInt(item.quantity), 0);
                
                return `
                    <div class="order-card fade-in">
                        <div class="order-header">
                            <div class="buyer-info">
                                <div class="buyer-avatar">${order.first_name[0]}${order.last_name[0]}</div>
                                <span style="font-weight:700; color:#fff;">${order.first_name} ${order.last_name}</span>
                                <span style="color:var(--text-dim); margin-left:10px; font-size:0.8rem;">SN: ${order.order_sn}</span>
                            </div>
                            <div class="status-badge st-${statusClass}">${order.status}</div>
                        </div>
                        <div class="order-body" style="padding-bottom:10px;">
                            ${order.items.map(item => `
                                <div class="order-item">
                                    <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(item.name_snapshot)}&background=random&color=fff" class="item-img">
                                    <div style="flex:1;">
                                        <div style="color:#fff; font-weight:600;">${item.name_snapshot}</div>
                                        <div style="color:var(--text-dim); font-size:0.8rem; margin-top:2px;">Variation: ${item.variation_snapshot || 'Default'}</div>
                                    </div>
                                    <div style="text-align:right;">
                                        <div style="font-size:0.75rem; color:var(--text-dim);">Actual: ₱${parseFloat(item.srp_snapshot || item.price).toLocaleString()}</div>
                                        ${parseFloat(item.item_exclusive_discount) > 0 ? `
                                            <div style="font-size:0.7rem; color:#818cf8; font-weight:600;">-₱${parseFloat(item.item_exclusive_discount).toLocaleString()} (Exclusive)</div>
                                        ` : ''}
                                        <div style="color:#fff; font-weight:700; margin-top:2px;">₱${parseFloat(item.price).toLocaleString()}</div>
                                        <div style="color:var(--text-dim); font-size:0.8rem;">x${item.quantity}</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        
                        <!-- Financial Breakdown -->
                        <div style="margin: 0 20px 20px; padding: 15px; background: rgba(255,255,255,0.02); border-radius: 12px; border: 1px solid rgba(255,255,255,0.03);">
                            <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:0.85rem;">
                                <span style="color:var(--text-dim);">SRP Total:</span>
                                <span style="color:#fff;">₱${parseFloat(order.srp_total || 0).toLocaleString()}</span>
                            </div>
                            <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:0.85rem; color:#818cf8;">
                                <span>Exclusive Plan Discount:</span>
                                <span>-₱${parseFloat(order.exclusive_discount_amount || 0).toLocaleString()}</span>
                            </div>
                            <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:0.85rem; color:#a855f7;">
                                <span>Merchant Vouchers:</span>
                                <span>-₱${parseFloat(order.voucher_discount_amount || 0).toLocaleString()}</span>
                            </div>
                            <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:0.85rem;">
                                <span style="color:var(--text-dim);">Shipping Fee:</span>
                                <span style="color:#fff;">₱${parseFloat(order.shipping_fee || 0).toLocaleString()}</span>
                            </div>
                            <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:0.85rem; color:#4ade80; border-top:1px dashed rgba(255,255,255,0.1); padding-top:10px; margin-top:10px;">
                                <span style="display:flex; align-items:center; gap:5px;">
                                    <ion-icon name="sparkles-outline"></ion-icon> Points Received (0.8%):
                                </span>
                                <span style="font-weight:700;">${parseFloat(order.points_earned || 0).toLocaleString()} Pts</span>
                            </div>
                            <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:0.85rem; color:var(--text-dim);">
                                <span style="display:flex; align-items:center; gap:5px;">
                                    <ion-icon name="business-outline"></ion-icon> Pridens System Fee (0.7%):
                                </span>
                                <span>₱${parseFloat(order.pridens_profit_amount || 0).toLocaleString()}</span>
                            </div>
                            <div style="display:flex; justify-content:space-between; margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.05); font-weight:700;">
                                <span style="color:#fff;">Grand Total:</span>
                                <span style="color:#6366f1; font-size:1.1rem;">₱${parseFloat(order.total_amount).toLocaleString()}</span>
                            </div>
                        </div>
                        <div class="order-footer">
                            <div style="color:var(--text-dim); font-size:0.85rem;">
                                ${totalQty} Item(s) | Payment: <span style="color:#fff; font-weight:600;">${order.payment_method}</span>
                            </div>
                            <div style="display:flex; align-items:center; gap:24px;">
                                <div style="text-align:right;">
                                    <span style="font-size:0.8rem; color:var(--text-dim);">Order Total:</span>
                                    <span style="font-size:1.2rem; font-weight:800; color:#6366f1; margin-left:8px;">₱${parseFloat(order.total_amount).toLocaleString()}</span>
                                </div>
                                ${order.status === 'Unpaid' && order.payment_method === 'COD' ? `
                                    <button class="btn-status" style="background:rgba(239, 68, 68, 0.1); color:#f87171;" onclick="updateStatus(${order.id}, 'Cancelled')">Disapprove COD</button>
                                    <button class="btn-status btn-primary" onclick="updateStatus(${order.id}, 'To Ship')">Approve COD Order</button>
                                ` : ''}
                                ${order.status === 'Payment Sent' ? `
                                    <button class="btn-status" style="background:rgba(255,255,255,0.05); color:#fff;" onclick="viewProof('${order.payment_proof_path}', '${order.channel_provider} - ${order.channel_account_name}')">View Proof</button>
                                    <button class="btn-status btn-primary" onclick="verifyPayment(${order.id}, 'approve')">Approve Payment</button>
                                    <button class="btn-status" style="background:rgba(239, 68, 68, 0.1); color:#f87171;" onclick="verifyPayment(${order.id}, 'reject')">Disapprove Proof</button>
                                ` : ''}
                                ${order.status === 'To Ship' ? `
                                    <button class="btn-status btn-primary" onclick="updateStatus(${order.id}, 'Shipping')">Arrange Shipment</button>
                                ` : ''}
                                ${order.status === 'Shipping' ? `
                                    <button class="btn-status btn-primary" onclick="updateStatus(${order.id}, 'Completed')">Mark as Received</button>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function verifyPayment(orderId, action) {
            if (!confirm(`Are you sure you want to ${action} this payment?`)) return;
            try {
                const res = await fetch(`../admin_API/verify_merchant_order_payment.php`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ order_id: orderId, action: action })
                });
                const json = await res.json();
                if (json.status === 'success') {
                    alert(json.message);
                    loadOrders();
                } else {
                    alert(json.message);
                }
            } catch (e) {
                alert('Connection Error');
            }
        }

        function viewProof(path, channelInfo) {
            const img = document.getElementById('proof-image');
            img.src = `../admin_API/${path}`;
            document.getElementById('proof-channel-info').textContent = channelInfo;
            document.getElementById('proof-modal').style.display = 'flex';
        }

        function closeProofModal() {
            document.getElementById('proof-modal').style.display = 'none';
        }

        async function updateStatus(orderId, nextStatus) {
            if (!confirm(`Move order to ${nextStatus}?`)) return;

            try {
                const res = await fetch(`../admin_API/update_merchant_order_status.php`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ order_id: orderId, status: nextStatus })
                });
                const json = await res.json();
                if (json.status === 'success') {
                    loadOrders();
                } else {
                    alert(json.message);
                }
            } catch (e) {
                alert('Connection Error');
            }
        }

        function switchTab(tab, element) {
            currentTab = tab;
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
            loadOrders();
        }

        function filterOrders() {
            const q = document.getElementById('order-search').value.toLowerCase();
            const filtered = allOrders.filter(o => 
                o.order_sn.toLowerCase().includes(q) || 
                o.first_name.toLowerCase().includes(q) || 
                o.last_name.toLowerCase().includes(q)
            );
            renderOrders(filtered);
        }
    </script>
</body>
</html>
