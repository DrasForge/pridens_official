<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Agency Documents</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');
        
        body { margin: 0; padding: 0; font-family: 'Outfit', sans-serif; background: #e2e8f0; color: #0f172a; }
        
        /* A4 Paper Dimensions */
        .page {
            width: 210mm;
            min-height: 297mm;
            padding: 20mm;
            margin: 10mm auto;
            border: 1px #D3D3D3 solid;
            border-radius: 5px;
            background: white;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            position: relative;
            page-break-after: always;
        }

        .controls {
            text-align: center;
            padding: 20px;
            background: #1e293b;
            color: white;
        }
        
        button {
            padding: 10px 20px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover { background: #4f46e5; }
        
        .loader {
            border: 4px solid rgba(0,0,0,0.1);
            border-top: 4px solid #6366f1;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 50px auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media print {
            .controls { display: none; }
            body { margin: 0; background: white; }
            .page {
                margin: 0;
                border: initial;
                border-radius: initial;
                width: initial;
                min-height: initial;
                box-shadow: initial;
                background: initial;
                page-break-after: always;
            }
        }
    </style>
</head>
<body>
    <div class="controls">
        <h2 style="margin-top: 0;">Agency Document Generator</h2>
        <button onclick="window.print()">🖨️ Print / Save as PDF</button>
    </div>

    <div id="loading" style="text-align: center;"><div class="loader"></div><p>Loading templates...</p></div>

    <div id="pages-container" style="display: none;">
        <!-- T&C Page -->
        <div class="page" id="tnc-page">
            <!-- Content Injected via JS -->
        </div>

        <!-- Certificate Page -->
        <div class="page" id="cert-page" style="page-break-after: avoid; display: flex; align-items: center; justify-content: center; height: 297mm;">
            <!-- Content Injected via JS -->
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const agentName = urlParams.get('name') || 'Agent Name';
        const agentRank = urlParams.get('rank') || 'Rank Position';
        const approvedDate = urlParams.get('date') || new Date().toLocaleDateString();

        async function fetchTemplates() {
            try {
                const [r1, r2] = await Promise.all([
                    fetch('../admin_API/get_document_template.php?type=terms_and_conditions'),
                    fetch('../admin_API/get_document_template.php?type=certificate')
                ]);
                const tncData = await r1.json();
                const certData = await r2.json();

                if(tncData.status === 'success' && certData.status === 'success') {
                    renderPage('tnc-page', tncData.data);
                    renderPage('cert-page', certData.data);
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('pages-container').style.display = 'block';
                } else {
                    alert("Error loading templates.");
                }
            } catch(e) {
                alert("Network error fetching templates.");
            }
        }

        function renderPage(elementId, htmlString) {
            let parsed = htmlString
                .replace(/\{\{AGENT_NAME\}\}/g, agentName)
                .replace(/\{\{AGENT_RANK\}\}/g, agentRank)
                .replace(/\{\{DATE\}\}/g, approvedDate);
            
            document.getElementById(elementId).innerHTML = parsed;
        }

        window.onload = fetchTemplates;
    </script>
</body>
</html>
