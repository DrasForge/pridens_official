<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <!-- Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=2">
    <link rel="stylesheet" href="css/dashboard.css?v=2">
    <!-- Ionicons for beautiful icons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body class="dashboard-body">
    <!-- Dynamic Background -->
    <div class="background-animation">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Sidebar Layout -->
    <div class="dashboard-layout">
        
        <!-- Sidebar Navigation (Modular) -->
        <aside class="sidebar" id="sidebar"></aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Header -->
            <header class="top-header">
                <button class="menu-btn" id="open-sidebar">
                    <ion-icon name="menu-outline"></ion-icon>
                </button>
                <div class="header-search">
                    <ion-icon name="search-outline"></ion-icon>
                    <input type="text" placeholder="Search anything...">
                </div>
                <div class="header-profile">
                    <div class="notification-bell">
                        <ion-icon name="notifications-outline"></ion-icon>
                        <span class="badge">3</span>
                    </div>
                    <div class="avatar">
                        <img src="https://ui-avatars.com/api/?name=Admin&background=6366f1&color=fff" alt="Admin">
                    </div>
                </div>
            </header>

            <!-- Dashboard Content -->
            <div class="dashboard-content">
                <div class="welcome-banner">
                    <h1>Welcome back, Admin!</h1>
                    <p>Here's what's happening today.</p>
                </div>

                <!-- Stats Grid -->
                <div class="stats-grid">
                    
                    <div class="stat-card">
                        <div class="stat-icon subscribers">
                            <ion-icon name="people"></ion-icon>
                        </div>
                        <div class="stat-info">
                            <h3>Total Active Subscribers</h3>
                            <div class="stat-value">
                                <span id="stat-subscribers">--</span>
                                <span class="trend positive"><ion-icon name="trending-up-outline"></ion-icon> 12%</span>
                            </div>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon agents">
                            <ion-icon name="briefcase"></ion-icon>
                        </div>
                        <div class="stat-info">
                            <h3>Total Active Agents</h3>
                            <div class="stat-value">
                                <span id="stat-agents">--</span>
                                <span class="trend positive"><ion-icon name="trending-up-outline"></ion-icon> 5%</span>
                            </div>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon applications">
                            <ion-icon name="document-text"></ion-icon>
                        </div>
                        <div class="stat-info">
                            <h3>Total Subscribers Applications</h3>
                            <div class="stat-value">
                                <span id="stat-applications">--</span>
                                <span class="trend neutral"><ion-icon name="remove-outline"></ion-icon> 0%</span>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <script src="js/sidebar-module.js"></script>
    <script src="js/dashboard.js?v=2"></script>
</body>
</html>
