<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Management - Products</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/accounts.css">
    <link rel="stylesheet" href="css/products.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body class="dashboard-body">
    <div class="background-animation">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="dashboard-layout">
        <!-- Sidebar Navigation (Modular) -->
        <aside class="sidebar" id="sidebar"></aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-header">
                <button class="menu-btn" id="open-sidebar">
                    <ion-icon name="menu-outline"></ion-icon>
                </button>
                <div class="header-search">
                    <ion-icon name="search-outline"></ion-icon>
                    <input type="text" id="product-search" placeholder="Search products by SKU or Name...">
                </div>
                <div class="header-profile">
                    <div class="notification-bell">
                        <ion-icon name="notifications-outline"></ion-icon>
                        <span class="badge">0</span>
                    </div>
                    <div class="avatar">
                        <img src="https://ui-avatars.com/api/?name=Admin&background=6366f1&color=fff" alt="Admin">
                    </div>
                </div>
            </header>

            <div class="dashboard-content">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                    <div class="welcome-banner">
                        <h1>POS Products</h1>
                        <p>Manage product catalog and pricing for the POS Terminal.</p>
                    </div>
                    <button class="btn-primary" id="add-product-btn" style="padding: 12px 24px; border-radius: 8px;">
                        <ion-icon name="add-outline" style="vertical-align: middle; margin-right: 8px;"></ion-icon> Add Product
                    </button>
                </div>

                <div class="table-container fade-in">
                    <table class="data-table" id="products-table">
                        <thead>
                            <tr>
                                <th>SKU</th>
                                <th>Product Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="products-tbody">
                            <!-- Data will be loaded via JS -->
                            <tr>
                                <td colspan="6" style="text-align: center; padding: 40px;">
                                    <div class="loader" style="margin: 0 auto 16px;"></div>
                                    <p>Loading products...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Product Modal -->
    <div class="modal-overlay" id="product-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Add Product</h2>
                <button class="close-modal" id="close-modal">&times;</button>
            </div>
            <form id="product-form">
                <input type="hidden" id="product-id">
                <div class="form-group">
                    <label for="sku">SKU / Code</label>
                    <input type="text" id="sku" placeholder="e.g. PRD-001" required>
                </div>
                <div class="form-group">
                    <label for="product-name">Product Name</label>
                    <input type="text" id="product-name" placeholder="e.g. New Agent Registration" required>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label for="product-base-price">Base Price (Cost)</label>
                        <input type="number" id="product-base-price" step="0.01" placeholder="0.00" required>
                    </div>
                    <div class="form-group">
                        <label for="product-price">Actual SRP</label>
                        <input type="number" id="product-price" step="0.01" placeholder="0.00" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category">
                        <option value="All Items">All Items</option>
                        <option value="Applications">Applications</option>
                        <option value="Subscriptions">Subscriptions</option>
                        <option value="Services">Services</option>
                        <option value="Others">Others</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="price">Price (₱)</label>
                    <input type="number" id="price" step="0.01" placeholder="0.00" required>
                </div>
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" id="btn-cancel">Cancel</button>
                    <button type="submit" class="btn-save" id="btn-save-product">Save Product</button>
                </div>
            </form>
        </div>

    <script src="js/sidebar-module.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/products.js"></script>
</body>
    <script>
        // Generic Sidebar Toggle (keep for compatibility)
        document.querySelectorAll('.nav-item-has-children').forEach(toggle => {
            const submenu = toggle.nextElementSibling;
            if (submenu && submenu.classList.contains('sub-menu')) {
                toggle.addEventListener('click', () => {
                    submenu.classList.toggle('open');
                    const icon = toggle.querySelector('.chevron');
                    if (icon) {
                        icon.style.transform = submenu.classList.contains('open') ? 'rotate(180deg)' : 'rotate(0deg)';
                    }
                });
                const icon = toggle.querySelector('.chevron');
                if (icon && submenu.classList.contains('open')) {
                    icon.style.transform = 'rotate(180deg)';
                }
            }
        });
    </script>

</body>
</html>
